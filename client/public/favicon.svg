    <!-- Tassel -->
    <path d="M48,27.5 L50.5,37 C49.5,38 48,39 48,42 C48,43 49,44 50,44 C51,44 52,43 52,42 C52,39 50.5,38 49.5,37 L48.5,27.5 Z" />
